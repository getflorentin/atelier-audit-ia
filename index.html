<div class="app">

        <a class="btn sm" href="#" data-act="open" data-url="fb">Facebook</a>

    </div>
    <div id="view"></div>
    <div id="notes" class="card noprint" style="margin-top:24px"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<canvas class="confetti hidden" id="confetti"></canvas>
